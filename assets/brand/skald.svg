    <path d="M25 41C28 29 38 17 51 10c-2 9-6 16-11 21l-3.5-.5 1.5 3c-3 3.5-7 7-10.5 9.5z"/>
    <path d="M24.6 39.2l3.6 3.2L11.5 56.5z"/>
  </g>
  <path d="M27.5 41.2 48.5 13.5" stroke="#17212b" stroke-width="1.6" stroke-linecap="round"/>
