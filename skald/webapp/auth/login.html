<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Sign in · Skald</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7.5'%20fill='%2317212b'/%3E%3Cpath%20d='M9.5%206.5%2013.5%204.5v21l-4%202z'%20fill='%23f4f6f8'/%3E%3Cg%20fill='%23f4f6f8'%20stroke='%2317212b'%20stroke-width='2'%20stroke-linejoin='round'%20paint-order='stroke'%3E%3Cpath%20d='M12%2021C13.5%2015%2018.5%208.5%2026%204.5c-1.5%207-6.5%2013.5-12.5%2017.5z'/%3E%3Cpath%20d='M11.4%2019.6l3%202.8L5%2029z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/traffic-auth/auth.css">
<script type="module" src="/traffic-auth/auth.js"></script>
</head>
<body data-page="login">
<main class="card" id="main">
  <p class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="var(--ink)"/><path d="M20 14.5 27 11v41l-7 3.5z" fill="var(--surface)"/><g fill="var(--surface)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M25 41C28 29 38 17 51 10c-2 9-6 16-11 21l-3.5-.5 1.5 3c-3 3.5-7 7-10.5 9.5z"/><path d="M24.6 39.2l3.6 3.2L11.5 56.5z"/></g><path d="M27.5 41.2 48.5 13.5" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/></svg><span>Skald</span></p>
  <h1>Sign in</h1>
  <p class="lede" id="lede">To see your sites' traffic.</p>
  <form id="form" method="post" novalidate>
    <div class="step" id="step-password">
      <label>Email <input type="email" name="email" id="email" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="254" required></label>
      <label>Password <input type="password" name="password" id="password" autocomplete="current-password" maxlength="1024" required></label>
      <label class="check"><input type="checkbox" name="remember" id="remember" checked aria-describedby="remember-hint"> Keep me signed in
        <span class="hint" id="remember-hint">For 14 days on this device. Untick on a shared computer: you are signed out when the browser closes.</span></label>
    </div>
    <div class="step" id="step-code" hidden>
      <label>Code <input class="code" type="text" name="code" id="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="32" aria-describedby="code-hint">
        <span class="hint" id="code-hint">The 6 digits your authenticator app shows now, or one of your recovery codes.</span></label>
    </div>
    <div class="step" id="step-new" hidden>
      <label>New password <input type="password" name="new_password" id="new-password" autocomplete="new-password" maxlength="1024" aria-describedby="new-hint">
        <span class="hint" id="new-hint">At least 12 characters. Your account was made from an invite link that someone else may have seen, so choose your own password now.</span></label>
      <label>New password again <input type="password" name="new_again" id="new-again" autocomplete="new-password" maxlength="1024"></label>
    </div>
    <div class="step" id="step-setup" hidden>
      <p class="hint">Key for the app (or open the link on this phone):</p>
      <p><code id="setup-secret"></code></p>
      <p><a id="setup-uri" href="#">Open in an authenticator app</a></p>
      <label>Code <input class="code" type="text" name="setup_code" id="setup-code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="32" aria-describedby="setup-hint">
        <span class="hint" id="setup-hint">The 6 digits the app shows now.</span></label>
    </div>
    <div class="step" id="step-codes" hidden>
      <p class="hint">Recovery codes. Each works once if you lose your phone. Keep them somewhere safe: they are shown only now.</p>
      <pre id="codes"></pre>
    </div>
    <p class="msg" id="msg" role="alert"></p>
    <button type="submit" class="btn primary" id="submit">Sign in</button>
  </form>
  <p class="links"><a href="/traffic-auth/forgot" id="forgot">Forgot password?</a><button type="button" class="btn link" id="back" hidden>Use another account</button></p>
  <noscript><p class="msg err">This page needs JavaScript switched on.</p></noscript>
</main>
</body>
</html>
