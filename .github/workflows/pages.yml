name: Demo on GitHub Pages

# The live demo: tools/demo.py runs sample data (a fictional site on example.com)
# through Skald's own pipeline and writes the dashboard as static files, which
# GitHub Pages serves at https://<owner>.github.io/<repo>/.
# Settings > Pages > Source must be "GitHub Actions".
# Actions are pinned to full commit SHAs (the comment says the release); update them together.

on:
  push:
    branches: [main]
  # Rebuilt every Monday so the demo's dates stay recent between releases.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Sample data through the pipeline, as static files
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: python3 tools/demo.py _site --repo-url "$REPO_URL"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}traffic/example.com/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
